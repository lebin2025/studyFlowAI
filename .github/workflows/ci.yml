name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studyflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studyflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # better-sqlite3 ships prebuilt binaries, but keep a compiler fallback
      # so the workflow stays reliable across runner image changes.
      - name: Install native build tools (fallback)
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Backend tests (SQLite)
        run: npm run test:server

      - name: Backend tests (PostgreSQL)
        run: npm run test:server
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/studyflow_test
          DATABASE_SSL: 'false'

      - name: Frontend tests
        run: npm run test:unit -- --run

      - name: End-to-end smoke test
        run: npm run smoke
        env:
          CI: true

# Render Blueprint — free Node web service + Supabase Postgres.
#
# This configuration deliberately has NO Render disk: the database lives in
# Supabase, so the free Render instance can restart without losing data.
# After creating the Blueprint, paste DATABASE_URL (Supabase Session Pooler
# connection string) and DEEPSEEK_API_KEY when prompted.
#
# Render free services sleep after inactivity; the first request may take a
# little longer. Supabase free projects pause after 7 days without activity.
services:
  - type: web
    name: studyflow-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Shanghai
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true
      - key: TRUST_PROXY
        value: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: true
      - key: DB_POOL_MAX
        value: 5
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: AI_RATE_LIMIT_PER_HOUR
        value: 8
